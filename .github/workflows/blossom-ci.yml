name: Blossom deployed-runner comment validation
on:
  pull_request:
    types: [synchronize]
    paths: [.github/workflows/blossom-ci.yml]
permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write
jobs:
  comment-verdicts:
    runs-on: blossom
    timeout-minutes: 10
    steps:
      - name: Verify controlled failure feedback from the deployed executable
        uses: actions/github-script@v7
        env:
          PROBE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_KEY: ${{ secrets.BLOSSOM_KEY }}
        with:
          script: |
            // Copyright (c) 2026, NVIDIA CORPORATION. All rights reserved.
            const fs = require('fs');
            const os = require('os');
            const path = require('path');
            const crypto = require('crypto');
            const cp = require('child_process');
            const binary = '/home/github/bin/blossom-ci';
            core.info('Deployed blossom-ci SHA256: ' + crypto.createHash('sha256').update(fs.readFileSync(binary)).digest('hex'));
            const scenarios = [
              {name:'missing-operation-comment', kind:'operation', reactions:['-1'], status:'failure', code:'environment'},
              {name:'missing-audit-comment', kind:'audit-missing', reactions:['-1'], status:'failure', code:'environment'},
              {name:'audit-directory-comment', kind:'audit-directory', reactions:['-1'], status:'failure', code:'audit-log'},
              {name:'receipt-before-configuration-failure', kind:'configuration', reactions:['eyes','-1'], status:'failure', code:'environment'},
              {name:'operator-authorization-rejection', kind:'authorization', reactions:['eyes','-1'], status:'failure', code:'authorization'},
              {name:'invalid-token-feedback', kind:'invalid-token', reactions:[], status:null, code:'environment'},
              {name:'null-event', kind:'null', reactions:[], status:null, code:'event-data'},
              {name:'malformed-event', kind:'malformed', reactions:[], status:null, code:'event-data'},
              {name:'unreadable-event', kind:'unreadable', reactions:[], status:null, code:'event-data'},
              {name:'missing-event-path', kind:'missing-path', reactions:[], status:null, code:'event-data'}
            ];
            const prNumber = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;
            const results = [];
            for (const scenario of scenarios) {
              core.startGroup(scenario.name);
              const {data: comment} = await github.rest.issues.createComment({...context.repo, issue_number:prNumber,
                body:'Controlled deployed-runner validation: `' + scenario.name + '`. Synthetic event input; expected failure, no Jenkins dispatch.'});
              const {data: previous} = await github.rest.repos.listCommitStatusesForRef({...context.repo,ref:headSha});
              const previousIds = new Set(previous.map(s=>s.id));
              const dir = fs.mkdtempSync(path.join(os.tmpdir(),'blossom-verdict-'));
              const eventPath = path.join(dir,'event.json');
              const auditPath = path.join(dir,'audit.log');
              const event = {action:'created',comment:{id:comment.id,body:'/bot run'},issue:{number:prNumber,pull_request:{}}};
              fs.writeFileSync(eventPath,JSON.stringify(event));
              const env = {...process.env, GITHUB_EVENT_NAME:'issue_comment',GITHUB_EVENT_PATH:eventPath,
                OPERATION:'AUTH',AUDIT_LOG_FILE:auditPath,REPO_TOKEN:process.env.PROBE_TOKEN,
                REPO_KEY_DATA:process.env.PROBE_KEY};
              if (scenario.kind==='operation') env.OPERATION='';
              if (scenario.kind==='audit-missing') env.AUDIT_LOG_FILE='';
              if (scenario.kind==='audit-directory') env.AUDIT_LOG_FILE=dir;
              if (['configuration','invalid-token'].includes(scenario.kind)) env.SECRET_TOKEN='';
              if (scenario.kind==='authorization') env.GITHUB_ACTOR='blossom-mr84-unregistered-test-user';
              if (scenario.kind==='invalid-token') env.REPO_TOKEN='invalid-blossom-test-token';
              if (scenario.kind==='null') fs.writeFileSync(eventPath,'null');
              if (scenario.kind==='malformed') fs.writeFileSync(eventPath,'{');
              if (scenario.kind==='unreadable') env.GITHUB_EVENT_PATH=path.join(dir,'absent.json');
              if (scenario.kind==='missing-path') delete env.GITHUB_EVENT_PATH;
              const execution = await new Promise(resolve => cp.execFile(binary,[],{env,cwd:dir,timeout:60000},
                (error,stdout,stderr)=>resolve({exit:error?error.code:0,stdout,stderr})));
              const audit = fs.existsSync(auditPath)?fs.readFileSync(auditPath,'utf8'):execution.stderr;
              const records=[];
              for (const line of audit.split('\n')) {
                const start=line.indexOf('{');
                if(start>=0) {try {records.push(JSON.parse(line.slice(start)));} catch(e) {}}
              }
              const {data: reactions} = await github.rest.reactions.listForIssueComment({...context.repo,comment_id:comment.id});
              const observed = reactions.filter(r=>r.user.login==='github-actions[bot]').map(r=>r.content);
              const {data: statuses} = await github.rest.repos.listCommitStatusesForRef({...context.repo,ref:headSha});
              const added = statuses.filter(s=>!previousIds.has(s.id)&&s.context==='blossom-ci');
              const auditOk=records.some(r=>r.status==='failure'&&r.code===scenario.code);
              const reactionOk=JSON.stringify(observed)===JSON.stringify(scenario.reactions);
              const statusOk=scenario.status===null?added.length===0:added.length===1&&added[0].state===scenario.status;
              const passed=execution.exit===255&&auditOk&&reactionOk&&statusOk;
              const result={case:scenario.name,passed,exit:execution.exit,audit:records,reactions:observed,
                statuses:added.map(s=>({state:s.state,description:s.description,target_url:s.target_url})),comment:comment.html_url};
              core.info('VERIFIED_RESULT '+JSON.stringify(result));
              for(const line of execution.stdout.split('\n')) {
                if(/^(SECRET_TOKEN environment variable missing|OPERATION environment variable missing|AUDIT_LOG_FILE environment variable missing|Failed to start job: user not authorised|Not authorized !!!|Failed to update github status !!!|Failed to acknowledge comment|Event data file contains no event payload|GITHUB_EVENT_PATH environment variable missing|Failed to open event data file|Failed to Unmarshal event data)/.test(line)) core.info('Observed: '+line);
              }
              if(!passed) core.setFailed('Unexpected verdict for '+scenario.name);
              results.push(result);
              fs.rmSync(dir,{recursive:true,force:true});
              core.endGroup();
            }
            await core.summary.addHeading('Deployed-binary comment and event validation').addTable([
             [{data:'Case',header:true},{data:'Result',header:true},{data:'Reactions',header:true}],
             ...results.map(r=>[r.case,r.passed?'PASS':'FAIL',r.reactions.join(', ')||'none'])
            ]).write();
