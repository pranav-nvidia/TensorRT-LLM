name: Blossom deployed-runner failure validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/blossom-ci.yml]
permissions:
  contents: read
  pull-requests: write
  statuses: write
jobs:
  failure-verdict:
    if: github.event.action == 'opened'
    name: ${{ matrix.case }}
    runs-on: blossom
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - case: missing-operation
            operation: ''
          - case: missing-audit-path
            operation: AUTH
          - case: audit-path-is-directory
            operation: AUTH
          - case: configuration-secret-missing
            operation: AUTH
          - case: automatic-pr-auth-rejection
            operation: AUTH
          - case: automatic-pr-dispatch-rejection
            operation: START-CI-JOB
          - case: feedback-token-missing
            operation: AUTH
    steps:
      - name: Identify deployed executable
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const path = '/home/github/bin/blossom-ci';
            const sha = crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
            core.info('Deployed blossom-ci SHA256: ' + sha);
            core.info('Runner: ' + process.env.RUNNER_NAME);
      - name: Exercise missing configuration secret
        id: config
        if: matrix.case == 'configuration-secret-missing'
        continue-on-error: true
        run: blossom-ci
        env:
          OPERATION: AUTH
          SECRET_TOKEN: ''
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_KEY_DATA: ${{ secrets.BLOSSOM_KEY }}
          AUDIT_LOG_FILE: ${{ runner.temp }}/blossom-${{ matrix.case }}.log
      - name: Exercise failure path
        id: verdict
        if: matrix.case != 'configuration-secret-missing'
        continue-on-error: true
        run: blossom-ci
        env:
          OPERATION: ${{ matrix.operation }}
          REPO_TOKEN: ${{ matrix.case != 'feedback-token-missing' && secrets.GITHUB_TOKEN || '' }}
          REPO_KEY_DATA: ${{ secrets.BLOSSOM_KEY }}
          CI_SERVER: ${{ secrets.CI_SERVER }}
          AUDIT_LOG_FILE: ${{ matrix.case != 'missing-audit-path' && (matrix.case == 'audit-path-is-directory' && runner.temp || format('{0}/blossom-{1}.log', runner.temp, matrix.case)) || '' }}
      - name: Record expected exit and audit evidence
        if: always()
        uses: actions/github-script@v7
        env:
          TEST_CASE: ${{ matrix.case }}
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          VERDICT_OUTCOME: ${{ steps.verdict.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const testCase = process.env.TEST_CASE;
            const outcome = testCase === 'configuration-secret-missing' ? process.env.CONFIG_OUTCOME : process.env.VERDICT_OUTCOME;
            core.info('Case: ' + testCase + '; operator step outcome: ' + outcome);
            if (outcome !== 'failure') core.setFailed('Expected a nonzero operator exit');
            const auditPath = path.join(process.env.RUNNER_TEMP, 'blossom-' + testCase + '.log');
            const expectedAudit = {
              'missing-operation': ['failure', 'environment'],
              'configuration-secret-missing': ['failure', 'environment'],
              'automatic-pr-auth-rejection': ['declined', 'auto-trigger-commits'],
              'automatic-pr-dispatch-rejection': ['failure', 'auto-trigger-commits'],
              'feedback-token-missing': ['failure', 'environment']
            }[testCase];
            if (fs.existsSync(auditPath)) {
              const text = fs.readFileSync(auditPath, 'utf8');
              const records = [];
              for (const line of text.split('\n').filter(Boolean)) {
                core.info('Audit evidence: ' + line);
                const start = line.indexOf('{');
                if (start >= 0) records.push(JSON.parse(line.slice(start)));
              }
              if (expectedAudit && !records.some(r => r.status === expectedAudit[0] && r.code === expectedAudit[1])) {
                core.setFailed('Expected audit verdict was not found');
              }
            } else {
              core.info('No test audit file; startup failures fall back to runner stderr.');
            }
            if (testCase !== 'feedback-token-missing') {
              const {data: statuses} = await github.rest.repos.listCommitStatusesForRef({
                ...context.repo, ref: context.payload.pull_request.head.sha
              });
              const status = statuses.find(s => s.context === 'blossom-ci');
              const expected = testCase === 'automatic-pr-auth-rejection' ? 'pending' : 'failure';
              core.info('Commit-status evidence: ' + JSON.stringify(status && {
                state: status.state, description: status.description, target_url: status.target_url
              }));
              if (!status || status.state !== expected || !status.target_url.endsWith('/' + context.runId)) {
                core.setFailed('Expected commit status for this run was not found');
              }
            }
  feedback-permission-denied:
    name: feedback-permission-denied
    if: github.event.action == 'synchronize'
    runs-on: blossom
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Record initial status IDs
        id: before
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.listCommitStatusesForRef({...context.repo, ref: context.payload.pull_request.head.sha});
            core.setOutput('ids', JSON.stringify(data.map(s => s.id)));
      - name: Fail configuration with read-only feedback credentials
        id: failure
        continue-on-error: true
        run: blossom-ci
        env:
          OPERATION: AUTH
          SECRET_TOKEN: ''
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_LOG_FILE: ${{ runner.temp }}/blossom-feedback-permission-denied.log
      - name: Verify failure exit, audit and absent status write
        if: always()
        uses: actions/github-script@v7
        env:
          STEP_OUTCOME: ${{ steps.failure.outcome }}
          BEFORE_IDS: ${{ steps.before.outputs.ids }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            core.info('Deployed blossom-ci SHA256: ' + crypto.createHash('sha256').update(fs.readFileSync('/home/github/bin/blossom-ci')).digest('hex'));
            if (process.env.STEP_OUTCOME !== 'failure') core.setFailed('Expected operator failure exit');
            const audit = fs.readFileSync(process.env.RUNNER_TEMP + '/blossom-feedback-permission-denied.log', 'utf8');
            for (const line of audit.split('\n').filter(Boolean)) core.info('Audit evidence: ' + line);
            if (!audit.includes('"status": "failure"') || !audit.includes('"code":"environment"')) core.setFailed('Missing failure audit');
            const {data} = await github.rest.repos.listCommitStatusesForRef({...context.repo, ref: context.payload.pull_request.head.sha});
            const before = JSON.parse(process.env.BEFORE_IDS);
            const added = data.filter(s => !before.includes(s.id) && s.context === 'blossom-ci');
            core.info('New blossom-ci status writes: ' + added.length);
            if (added.length !== 0) core.setFailed('Read-only token unexpectedly created a status');
