name: Blossom pass 2 HTTP validation
on:
  pull_request:
    types: [opened, synchronize]
    paths: [.github/workflows/blossom-ci.yml, .github/blossom-pass2/**]
permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write
  statuses: write
env:
  FIXTURE_NAME: http-200
jobs:
  Authorization:
    name: Authorization
    if: github.repository == 'pranav-nvidia/TensorRT-LLM' && github.actor == 'pranav-nvidia'
    runs-on: blossom
    timeout-minutes: 10
    outputs:
      args: ${{ env.args }}
    steps:
      - name: Authorize synthetic command with actual deployed Blossom
        uses: actions/github-script@v7
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_KEY_DATA: ${{ secrets.BLOSSOM_KEY }}
        with:
          script: |
            const fs = require('node:fs');
            const os = require('node:os');
            const path = require('node:path');
            const cp = require('node:child_process');
            const pr = context.payload.pull_request;
            const {data: marker} = await github.rest.issues.createComment({...context.repo, issue_number: pr.number,
              body: `Pass 2 ${process.env.FIXTURE_NAME}: authorize synthetic /bot run, perform a fresh real scan, then test the deployed binary against a controlled HTTP response.`});
            const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'blossom-pass2-auth-'));
            try {
              const eventPath = path.join(dir, 'event.json');
              fs.writeFileSync(eventPath, JSON.stringify({action:'created', comment:{id:marker.id,body:'/bot run'}, issue:{number:pr.number,pull_request:{}}}));
              const env = {...process.env, OPERATION:'AUTH', GITHUB_EVENT_NAME:'issue_comment', GITHUB_EVENT_PATH:eventPath, AUDIT_LOG_FILE:path.join(dir,'audit.log')};
              const execution = await new Promise(resolve => cp.execFile('/home/github/bin/blossom-ci',[],{env,timeout:180000},
                (error,stdout,stderr)=>resolve({exit:error?error.code:0,stdout,stderr})));
              core.info('PASS2_AUTH '+JSON.stringify({exit:execution.exit,comment:marker.html_url,headSha:pr.head.sha}));
              if (execution.exit !== 0) core.setFailed('Real Blossom AUTH failed; no scan/HTTP coverage');
            } finally { fs.rmSync(dir,{recursive:true,force:true}); }
  Vulnerability-scan:
    name: Vulnerability scan
    needs: [Authorization]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: ${{ fromJson(needs.Authorization.outputs.args).repo }}
          ref: ${{ fromJson(needs.Authorization.outputs.args).ref }}
          lfs: 'true'
      - name: Run blossom action
        uses: NVIDIA/blossom-action@main
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_KEY_DATA: ${{ secrets.BLOSSOM_KEY }}
        with:
          args1: ${{ fromJson(needs.Authorization.outputs.args).args1 }}
          args2: ${{ fromJson(needs.Authorization.outputs.args).args2 }}
          args3: ${{ fromJson(needs.Authorization.outputs.args).args3 }}
  Job-trigger:
    name: Controlled HTTP verdict
    needs: [Vulnerability-scan]
    runs-on: blossom
    timeout-minutes: 10
    steps:
      - name: Exercise installed binary and collect actual verdict evidence
        uses: actions/github-script@v7
        env:
          PROBE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('node:fs');
            const os = require('node:os');
            const path = require('node:path');
            const dir = fs.mkdtempSync(path.join(os.tmpdir(),'blossom-pass2-code-'));
            try {
              for (const name of ['webhook-fixture.cjs','run-dispatch-probe.cjs']) {
                const {data} = await github.rest.repos.getContent({...context.repo,
                  path:'.github/blossom-pass2/'+name,ref:context.payload.pull_request.head.sha});
                fs.writeFileSync(path.join(dir,name),Buffer.from(data.content,'base64'));
              }
              const {runDispatchProbe} = require(path.join(dir,'run-dispatch-probe.cjs'));
              await runDispatchProbe({github,context,core,fixtureName:process.env.FIXTURE_NAME,
                prNumber:context.payload.pull_request.number,expectedPrHeadSha:context.payload.pull_request.head.sha});
            } finally { fs.rmSync(dir,{recursive:true,force:true}); }
